  <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Bons Plans & Business</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- En-tête / Header -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-brands fa-pinterest logo-icon"></i>
      <span>MesTrouvailles</span>
    </div>
    
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Rechercher un produit...">
    </div>
  </header>

  <!-- Filtres par catégories -->
  <div class="categories">
    <button class="filter-btn active" data-category="all">Tout</button>
    <button class="filter-btn" data-category="business">Business & Formations</button>
    <button class="filter-btn" data-category="amazon">Produits Amazon</button>
  </div>

  <!-- Grille de produits -->
  <main class="grid-container" id="productGrid">
    <!-- Contenu généré par JavaScript -->
  </main>

</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
